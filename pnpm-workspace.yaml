packages:
  - 'packages/*'
  - 'demos/*'
  - 'site'

blockExoticSubdeps: true

minimumReleaseAge: 1440

trustPolicy: no-downgrade

trustPolicyExclude:
  - 'semver@6.3.1'

saveExact: true

overrides:
  defu: ">=6.1.5"
  vite: ">=8.0.16"
  brace-expansion: ">=1.1.13"
  undici: ">=7.29.0 <8"
  postcss: ">=8.5.10"
  sharp: ">=0.35.0"
  shell-quote: ">=1.11.0"
  launch-editor: ">=2.14.2"
  "@tailwindcss/typography>postcss-selector-parser": "7.1.6"

allowBuilds:
  esbuild: true
  sharp: false
  simple-git-hooks: false
  workerd: true
